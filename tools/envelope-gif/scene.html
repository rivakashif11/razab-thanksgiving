<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'PF'; src:url('fonts/playfair-600.woff2') format('woff2'); font-weight:600; font-style:normal; font-display:block; }
  @font-face { font-family:'PF'; src:url('fonts/playfair-italic.woff2') format('woff2'); font-weight:400; font-style:italic; font-display:block; }
  @font-face { font-family:'IN'; src:url('fonts/inter-400.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:block; }
  @font-face { font-family:'IN'; src:url('fonts/inter-700.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:block; }

  html,body { margin:0; padding:0; background:#F6F0E6; }
  #stage { position:relative; width:600px; height:360px; overflow:hidden; background:#F6F0E6; }

  .grain {
    position:absolute; inset:0; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay; opacity:.22;
  }

  /* ---- shadow under the envelope ---- */
  #shadow {
    position:absolute; left:150px; top:322px; width:300px; height:38px; z-index:0;
    background:radial-gradient(50% 50% at 50% 50%, rgba(90,61,54,.30) 0%, rgba(90,61,54,.16) 45%, rgba(90,61,54,0) 72%);
    filter:blur(5px);
  }

  /* ---- envelope ---- */
  .panel { position:absolute; left:150px; width:300px; }

  #back {
    top:136px; height:200px; z-index:1; border-radius:4px;
    background:linear-gradient(180deg,#7E4A41 0%,#8A5047 30%,#8F544A 100%);
    box-shadow:inset 0 1px 0 rgba(247,204,131,.22);
  }

  /* inner lining at the envelope mouth: hidden by the flap while closed, revealed when it opens */
  #mouth {
    top:140px; height:13px; z-index:5; border-radius:4px 4px 0 0;
    /* same taper as the flap edges, so the closed flap hides it completely */
    clip-path:polygon(0 0, 100% 0, 94.3% 100%, 5.7% 100%);
    background:linear-gradient(180deg,#F7E8CB 0%,#F3E1BC 55%,#E3CDA3 100%);
    box-shadow:inset 0 -3px 5px rgba(143,84,74,.22), inset 0 1px 0 rgba(255,255,255,.5);
  }

  #flapWrap { position:absolute; left:150px; top:140px; width:300px; height:116px; z-index:6; perspective:1000px; }
  #flap {
    position:absolute; inset:0; transform-origin:50% 0%; transform-style:preserve-3d;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    background:linear-gradient(180deg,#A86A5F 0%,#A0645A 46%,#96594F 100%);
    box-shadow:inset 0 -1px 0 rgba(90,61,54,.25);
  }
  #flapSheen {
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,241,214,.16) 48%, rgba(255,255,255,0) 64%);
  }
  /* crease line down the middle of the flap */
  #flapCrease {
    position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none;
    background:linear-gradient(90deg, rgba(90,61,54,0) 49.4%, rgba(90,61,54,.10) 50%, rgba(255,230,190,.10) 50.6%, rgba(90,61,54,0) 51.2%);
  }

  #front {
    top:140px; height:196px; z-index:4; border-radius:4px;
    background:linear-gradient(176deg,#95594F 0%,#8F544A 38%,#8A5047 76%,#834A42 100%);
    box-shadow:inset 0 1px 0 rgba(247,204,131,.28), inset 0 -1px 0 rgba(90,61,54,.35), 0 1px 2px rgba(90,61,54,.18);
  }
  /* the two diagonal seams of the front pocket */
  #frontSeams {
    position:absolute; inset:0; pointer-events:none; border-radius:4px; overflow:hidden;
  }
  #frontSeams i {
    position:absolute; left:50%; top:-2px; width:1px; height:235px; transform-origin:50% 0;
    background:linear-gradient(180deg, rgba(90,61,54,.22), rgba(90,61,54,0) 86%);
  }
  #frontSeams i:nth-child(1){ transform:rotate(57.4deg); }
  #frontSeams i:nth-child(2){ transform:rotate(-57.4deg); }
  #frontSeams i:nth-child(3){ left:0; top:0; width:100%; height:1px; transform:none; background:linear-gradient(90deg, rgba(247,204,131,0), rgba(247,204,131,.35), rgba(247,204,131,0)); }
  #frontSeams b {
    position:absolute; left:50%; top:-2px; width:2px; height:235px; transform-origin:50% 0;
    background:linear-gradient(180deg, rgba(255,232,198,.20), rgba(255,232,198,0) 80%);
  }
  #frontSeams b:nth-child(4){ transform:rotate(57.4deg) translateX(1.5px); }
  #frontSeams b:nth-child(5){ transform:rotate(-57.4deg) translateX(-1.5px); }

  /* ---- wax seal ---- */
  #seal { position:absolute; left:262px; top:202px; width:76px; height:76px; z-index:7;
          filter:drop-shadow(0 2px 3px rgba(90,61,54,.35)); }
  #seal svg { position:absolute; inset:0; overflow:visible; }
  #glintClip { position:absolute; inset:0; border-radius:50%; overflow:hidden; pointer-events:none; }
  #glint {
    position:absolute; top:-30%; left:0; width:38%; height:160%;
    background:linear-gradient(90deg, rgba(255,247,224,0), rgba(255,250,235,.85), rgba(255,247,224,0));
    transform:rotate(18deg); filter:blur(3px);
  }

  /* ---- card ---- */
  #card {
    position:absolute; left:80px; top:37px; width:440px; height:288px; z-index:2;
    background:linear-gradient(170deg,#FFFFFF 0%,#FAF7F2 55%,#F7F2EA 100%);
    border:1px solid #F7CC83; border-radius:5px;
    box-shadow:0 10px 26px rgba(90,61,54,.16), 0 1px 0 rgba(255,255,255,.9) inset;
    transform-origin:50% 50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 46px; box-sizing:border-box;
  }
  #card .inner { position:absolute; inset:7px; border:1px solid rgba(247,204,131,.55); border-radius:3px; pointer-events:none; }
  #t1 { font-family:'PF',Georgia,serif; font-style:italic; font-weight:400; font-size:17px; line-height:26px; color:#C87F4E; margin:0 0 10px 0; }
  #t2 { font-family:'PF',Georgia,serif; font-weight:600; font-size:34px; line-height:42px; color:#8F544A; margin:0 0 14px 0; letter-spacing:-0.01em; }
  #rule { width:52px; height:1px; background:#F7CC83; margin:0 0 14px 0; }
  #t3 { font-family:'IN',Arial,sans-serif; font-weight:400; font-size:15px; line-height:24px; color:#5A3D36; margin:0 0 16px 0; }
  #t4 { font-family:'IN',Arial,sans-serif; font-weight:700; font-size:14px; line-height:20px; letter-spacing:0.2em; color:#64875D; margin:0; }
</style>
</head>
<body>
<div id="stage">
  <div id="shadow"></div>

  <div class="panel" id="back"><div class="grain"></div></div>

  <div id="card">
    <div class="inner"></div>
    <p id="t1">You are invited</p>
    <h1 id="t2">Hurry, the Harvest Sale is live</h1>
    <div id="rule"></div>
    <p id="t3">Ending soon. 20% off every glass container</p>
    <p id="t4">Code HARVEST</p>
  </div>

  <div class="panel" id="front">
    <div id="frontSeams"><i></i><i></i><i></i><b></b><b></b></div>
    <div class="grain"></div>
  </div>
  <div class="panel" id="mouth"></div>

  <div id="flapWrap">
    <div id="flap">
      <div class="grain"></div>
      <div id="flapCrease"></div>
      <div id="flapSheen"></div>
    </div>
  </div>

  <div id="seal">
    <svg id="sealSvg" viewBox="0 0 64 64" width="76" height="76">
      <defs>
        <radialGradient id="wax" cx="36%" cy="30%" r="78%">
          <stop offset="0%"  stop-color="#F7CC83"/>
          <stop offset="38%" stop-color="#E2A83F"/>
          <stop offset="82%" stop-color="#C98F2A"/>
          <stop offset="100%" stop-color="#B8801F"/>
        </radialGradient>
        <radialGradient id="waxIn" cx="42%" cy="36%" r="70%">
          <stop offset="0%" stop-color="#F7CC83" stop-opacity=".55"/>
          <stop offset="70%" stop-color="#E2A83F" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="clipL"><rect x="-6" y="-6" width="38" height="76"/></clipPath>
        <clipPath id="clipR"><rect x="32" y="-6" width="38" height="76"/></clipPath>
      </defs>
      <g id="halfL" clip-path="url(#clipL)"><use href="#sealBody"/></g>
      <g id="halfR" clip-path="url(#clipR)"><use href="#sealBody"/></g>
      <g id="sealBody">
        <path id="scallop" fill="url(#wax)" stroke="#B8801F" stroke-width=".6"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="#B8801F" stroke-width="1" opacity=".55"/>
        <circle cx="32" cy="32" r="22" fill="url(#waxIn)"/>
        <!-- embossed wheat stalk: shadow copy then highlight copy -->
        <g id="emblem" transform="translate(32,32) scale(1.06)">
          <g id="wheatShadow" transform="translate(1,1.1)" stroke="#9A6612" fill="#9A6612" opacity=".92"></g>
          <g id="wheatLight" transform="translate(-.7,-.8)" stroke="#FBE0AC" fill="#FBE0AC" opacity=".85"></g>
          <g id="wheatMid" stroke="#C9922A" fill="#C9922A" opacity="1"></g>
        </g>
      </g>
    </svg>
    <div id="glintClip"><div id="glint"></div></div>
  </div>
</div>

<script>
/* ---------- build the scalloped wax rim + the wheat emblem ---------- */
(function build(){
  var cx=32, cy=32, lobes=13, R=29.5, r=26.6, pts=[];
  for (var i=0;i<lobes*2;i++){
    var a = (i/(lobes*2))*Math.PI*2 - Math.PI/2;
    var rad = (i%2===0) ? R : r;
    pts.push([cx+Math.cos(a)*rad, cy+Math.sin(a)*rad]);
  }
  var d='M '+pts[0][0].toFixed(2)+' '+pts[0][1].toFixed(2);
  for (var j=1;j<=pts.length;j++){
    var p=pts[j%pts.length], prev=pts[j-1];
    var mx=(prev[0]+p[0])/2, my=(prev[1]+p[1])/2;
    var ca=Math.atan2(my-cy,mx-cx), cr=Math.hypot(mx-cx,my-cy)*1.10;
    d+=' Q '+(cx+Math.cos(ca)*cr).toFixed(2)+' '+(cy+Math.sin(ca)*cr).toFixed(2)+' '+p[0].toFixed(2)+' '+p[1].toFixed(2);
  }
  document.getElementById('scallop').setAttribute('d', d+' Z');

  // wheat stalk: stem + paired grains
  function wheat(g, sw){
    var svgns='http://www.w3.org/2000/svg';
    var stem=document.createElementNS(svgns,'path');
    stem.setAttribute('d','M 0 13 C 0 6, 0 0, 0 -13');
    stem.setAttribute('fill','none'); stem.setAttribute('stroke-width',sw);
    stem.setAttribute('stroke-linecap','round');
    g.appendChild(stem);
    for (var k=0;k<5;k++){
      var y = -11 + k*4.6;
      for (var s=-1;s<=1;s+=2){
        var e=document.createElementNS(svgns,'ellipse');
        e.setAttribute('cx', s*4.1); e.setAttribute('cy', y+1.2);
        e.setAttribute('rx', 3.5); e.setAttribute('ry', 1.7);
        e.setAttribute('stroke','none');
        e.setAttribute('transform','rotate('+(s*34)+','+(s*4.1)+','+(y+1.2)+')');
        g.appendChild(e);
      }
    }
    // two leaves at the base
    for (var s2=-1;s2<=1;s2+=2){
      var lf=document.createElementNS(svgns,'path');
      lf.setAttribute('d','M 0 11 C '+(s2*4)+' 9, '+(s2*7)+' 12, '+(s2*7.5)+' 16');
      lf.setAttribute('fill','none'); lf.setAttribute('stroke-width',sw*0.8);
      lf.setAttribute('stroke-linecap','round');
      g.appendChild(lf);
    }
  }
  wheat(document.getElementById('wheatShadow'),1.9);
  wheat(document.getElementById('wheatLight'),1.9);
  wheat(document.getElementById('wheatMid'),1.9);
})();

/* ---------- deterministic timeline ---------- */
var T = 7.0;
function cl(x){ return x<0?0:(x>1?1:x); }
function seg(t,a,b){ return cl((t-a)/(b-a)); }
function easeInOut(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
function easeOut(x){ return 1-Math.pow(1-x,3); }
function easeIn(x){ return x*x*x; }
function lerp(a,b,x){ return a+(b-a)*x; }

var E = {
  shadow:document.getElementById('shadow'),
  back:document.getElementById('back'),
  front:document.getElementById('front'),
  mouth:document.getElementById('mouth'),
  flap:document.getElementById('flap'),
  flapWrap:document.getElementById('flapWrap'),
  seal:document.getElementById('seal'),
  halfL:document.getElementById('halfL'),
  halfR:document.getElementById('halfR'),
  glint:document.getElementById('glint'),
  card:document.getElementById('card'),
  t1:document.getElementById('t1'), t2:document.getElementById('t2'),
  rule:document.getElementById('rule'), t3:document.getElementById('t3'), t4:document.getElementById('t4')
};

window.setT = function(t){
  t = t % T;

  /* --- return pass (6.2 -> 7.0) brings everything back to the t=0 state --- */
  var retCard  = seg(t,6.20,6.80);   // card fades + sinks back
  var retEnv   = seg(t,6.30,6.95);   // envelope fades back in
  var retFlap  = seg(t,6.40,6.95);   // flap closes
  var retSeal  = seg(t,6.55,7.00);   // seal re-forms

  /* --- envelope presence --- */
  var envOut = seg(t,2.55,3.00);
  var envOp  = cl(1 - envOut + retEnv);
  var envScale = lerp(1,0.965, easeInOut(envOut)) * lerp(0.965,1, easeOut(retEnv));
  var envY = lerp(0,14, easeInOut(envOut)) * (1-easeOut(retEnv));

  /* --- gentle float while closed --- */
  var flapOpenRaw = easeInOut(seg(t,1.30,2.00));
  var flapOpen = flapOpenRaw * (1 - easeInOut(retFlap));
  var floatAmp = 4 * (1 - flapOpen);
  var floatY = Math.sin(2*Math.PI * t * 8 / T) * floatAmp;

  var envT = 'translateY(' + (envY + floatY).toFixed(2) + 'px) scale(' + envScale.toFixed(4) + ')';
  var envOpS = envOp.toFixed(3);
  ['shadow','back','front','mouth','flapWrap','seal'].forEach(function(k){
    E[k].style.transform = envT;
    E[k].style.transformOrigin = '50% 70%';
    E[k].style.opacity = envOpS;
  });
  E.shadow.style.opacity = (envOp * lerp(1,.55,easeInOut(envOut))).toFixed(3);

  /* --- flap rotation --- */
  var ang = -172 * flapOpen;
  E.flap.style.transform = 'rotateX(' + ang.toFixed(2) + 'deg)';
  if (ang < -90) {
    // past vertical: we are looking at the inside of the flap -> honey-cream lining
    E.flap.style.background = 'linear-gradient(0deg,#EAD3A6 0%,#F3E1BC 45%,#F7E8CB 100%)';
    E.flap.style.boxShadow = 'inset 0 -2px 6px rgba(143,84,74,.18)';
    document.getElementById('flapCrease').style.opacity = '0.25';
  } else {
    E.flap.style.background = 'linear-gradient(180deg,#A86A5F 0%,#A0645A 46%,#96594F 100%)';
    E.flap.style.boxShadow = 'inset 0 -1px 0 rgba(90,61,54,.25)';
    document.getElementById('flapCrease').style.opacity = '1';
  }
  E.flapWrap.style.zIndex = (ang < -90) ? 0 : 6;
  E.flap.style.filter = (ang > -88)
    ? 'drop-shadow(0 ' + (2 + 4*flapOpen).toFixed(1) + 'px ' + (3 + 5*flapOpen).toFixed(1) + 'px rgba(90,61,54,' + (0.22 + 0.10*flapOpen).toFixed(2) + '))'
    : 'none';

  /* --- wax seal: crack open, then re-form on the return --- */
  var crackRaw = easeOut(seg(t,0.80,1.30));
  var crack = crackRaw * (1 - easeInOut(retSeal));
  var sealOp = cl(1 - crackRaw + retSeal);
  E.seal.style.opacity = (sealOp * envOp).toFixed(3);
  E.halfL.setAttribute('transform','translate(' + (-10*crack).toFixed(2) + ',' + (2.5*crack).toFixed(2) + ') rotate(' + (-7*crack).toFixed(2) + ',32,32)');
  E.halfR.setAttribute('transform','translate(' + ( 10*crack).toFixed(2) + ',' + (2.0*crack).toFixed(2) + ') rotate(' + ( 6*crack).toFixed(2) + ',32,32)');

  /* --- glint sweeping the seal (closed phase only) --- */
  var gp = seg(t,0.10,0.78);
  E.glint.style.left = lerp(-45,112,gp).toFixed(1) + '%';
  E.glint.style.opacity = (gp>0 && gp<1 ? Math.sin(Math.PI*gp) : 0).toFixed(3);

  /* --- card: rise, then scale up to fill the frame --- */
  var riseP  = easeInOut(seg(t,2.00,2.60));          // out of the envelope
  var growP  = easeInOut(seg(t,2.55,3.05));          // scale up + settle
  var backP  = easeInOut(retCard);                   // return

  var dy = lerp(lerp(69,-89,riseP), 0, growP);
  var sc = lerp(0.591, 1, growP);
  dy = lerp(dy, 24, backP);
  sc = lerp(sc, 0.90, backP);

  E.card.style.transform = 'translateY(' + dy.toFixed(2) + 'px) scale(' + sc.toFixed(4) + ')';
  var cardOp = (t >= 2.0 ? 1 : 0) * (1 - backP);
  E.card.style.opacity = cardOp.toFixed(3);
  E.card.style.zIndex = (envOp < 0.02) ? 10 : 2;
  E.card.style.boxShadow = '0 ' + (6+10*growP).toFixed(1) + 'px ' + (16+14*growP).toFixed(1) + 'px rgba(90,61,54,' + (0.10+0.08*growP).toFixed(3) + '), 0 1px 0 rgba(255,255,255,.9) inset';

  /* --- text fades in, staggered --- */
  var items = [E.t1,E.t2,E.rule,E.t3,E.t4];
  for (var i=0;i<items.length;i++){
    var p = easeOut(seg(t, 3.00 + i*0.11, 3.34 + i*0.11));
    items[i].style.opacity = (p * (1-backP)).toFixed(3);
    items[i].style.transform = 'translateY(' + lerp(7,0,p).toFixed(2) + 'px)';
  }
};

var qs = new URLSearchParams(location.search);
window.setT(qs.has('t') ? parseFloat(qs.get('t')) : 0);
document.fonts.ready.then(function(){ window.__fontsReady = true; });
</script>
</body>
</html>
